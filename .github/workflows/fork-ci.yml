name: Fork CI

"on":
  pull_request:
    branches: [patched]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Format and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check
        run: .github/fork/check.sh
